name: Sync to customer repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main branch to customer repository
        env:
          CUSTOMER_REPO_TOKEN: ${{ secrets.CUSTOMER_REPO_TOKEN }}
        run: |
          set -e
          git remote add customer "https://x-access-token:${CUSTOMER_REPO_TOKEN}@github.com/demand-resource/Water-AI.git"
          git push customer HEAD:main --force
